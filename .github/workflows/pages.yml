name: Deploy pilot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        run: |
          mkdir -p _site
          unzip -o yosmany-digital-v5-9-banners-cafe-2026-11-14.zip -d _site
          if [ -d _site/sitio-v5-9 ]; then mv _site/sitio-v5-9/* _site/ && rmdir _site/sitio-v5-9; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
